
networks:
  cloud-vpc:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16

services:
  # --- Identity Provider (AuthN & RBAC) ---
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: vault_idp
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin                # Changed this
      KEYCLOAK_ADMIN_PASSWORD: super_secure_admin # Changed this
    ports:
      - "8080:8080"
    networks:
      cloud-vpc:
        ipv4_address: 10.5.0.40

  # 1. Cloud DNS (Route 53)
  internal-dns:
    image: coredns/coredns:latest
    container_name: vault_dns
    command: -conf /etc/coredns/Corefile
    volumes:
      - ./dns:/etc/coredns
    networks:
      cloud-vpc:
        ipv4_address: 10.5.0.53

  # 2. Object Storage (S3)
  minio:
    image: minio/minio:latest
    container_name: local-s3-engine
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root_admin
      MINIO_ROOT_PASSWORD: secure_password_123
    command: server /data --console-address ":9001"
    networks:
      cloud-vpc:
        ipv4_address: 10.5.0.10

  # 3. FastAPI Web Application
  api-service:
    build: .
    container_name: vault_api
    ports:
      - "8000:8000"
    dns:
      - 10.5.0.53  # Forces the API to ask CoreDNS for directions!
    env_file:
      - .env       # Loads the unified vault.local endpoint
    depends_on:
      - internal-dns
      - minio
      - keycloak   # Tells Docker to boot Keycloak before the API
    networks:
      cloud-vpc:
        ipv4_address: 10.5.0.20

volumes:
  minio_data:

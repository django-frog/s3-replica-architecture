
networks:
  cloud-vpc:
    driver: bridge


services:
  # --- Identity Provider (AuthN & RBAC) ---
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: vault_idp
    command: start-dev
    environment:
      # Interpolated from .env!
      KEYCLOAK_ADMIN: ${INFRA_KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${INFRA_KEYCLOAK_PASSWORD}
      # Restrict Keycloak's JVM memory footprint to prevent crashing on the free tier
      JAVA_OPTS_APPEND: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-theme/vault-theme:/opt/keycloak/themes/vault-theme
    networks:
      - cloud-vpc
    deploy:
      resources:
        limits:
          memory: 384M

  # --- Object Storage (S3) ---
  minio:
    image: minio/minio:latest
    container_name: local-s3-engine
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # Interpolated from .env!
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    networks:
      - cloud-vpc
    deploy:
      resources:
        limits:
          memory: 256M

  # --- FastAPI Web Application ---
  api-service:
    build: .
    container_name: vault_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - minio
      - keycloak
    networks:
      - cloud-vpc
    deploy:
      resources:
        limits:
          memory: 128M

  # --- Frontend Application ---
  webapp:
    build: ./frontend
    container_name: vault_ui
    ports:
      - "3000:3000"
    depends_on:
      - api-service
    networks:
      - cloud-vpc
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  minio_data:

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Vault</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f4f9; color: #333; max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        select, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #2980b9; }
        #result-section { display: none; border-top: 2px solid #eee; padding-top: 20px; margin-top: 20px; }
        .meta-box { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; margin-bottom: 15px;}
        .download-btn { background-color: #2ecc71; text-align: center; display: block; text-decoration: none; }
        .download-btn:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🔐 Secure Document Vault</h1>
        <p>Upload a file to MinIO. The backend will assign metadata and return a 60-second secure download link.</p>

        <form id="uploadForm">
            <div class="form-group">
                <label for="fileInput">Select File to Vault:</label>
                <input type="file" id="fileInput" required>
            </div>

            <div class="form-group">
                <label for="classification">Data Classification:</label>
                <select id="classification">
                    <option value="public">Public (General Info)</option>
                    <option value="internal">Internal (Company Only)</option>
                    <option value="restricted">Restricted (Highly Sensitive)</option>
                </select>
            </div>

            <button type="submit" id="uploadBtn">Upload to S3 / MinIO</button>
        </form>

        <!-- Hidden section that appears after successful upload -->
        <div id="result-section">
            <h3>✅ Upload Successful</h3>
            <p><strong>Object Key in MinIO:</strong> <span id="display-key"></span></p>
            
            <label>Object Metadata (from S3):</label>
            <div class="meta-box" id="display-meta">Loading metadata...</div>

            <p style="color: #e74c3c; font-size: 14px;"><strong>Note:</strong> The link below is a Pre-Signed URL. It will self-destruct in 60 seconds.</p>
            <a href="#" id="downloadLink" class="download-btn" target="_blank" style="color: white; padding: 12px 20px; border-radius: 5px; font-weight: bold;">
                🔗 Access Secure File
            </a>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000/v1/documents";

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            const classification = document.getElementById('classification').value;
            const uploadBtn = document.getElementById('uploadBtn');

            if (fileInput.files.length === 0) return;

            uploadBtn.innerText = "Encrypting & Uploading...";
            uploadBtn.disabled = true;

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("classification", classification);

            try {
                // 1. Upload the File
                const uploadRes = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const uploadData = await uploadRes.json();
                const objectKey = uploadData.object_key;

                // 2. Fetch the Pre-signed Download Link
                const linkRes = await fetch(`${API_BASE}/download-link?object_key=${encodeURIComponent(objectKey)}`);
                const linkData = await linkRes.json();

                // 3. Fetch the attached Metadata
                const metaRes = await fetch(`${API_BASE}/metadata?object_key=${encodeURIComponent(objectKey)}`);
                const metaData = await metaRes.json();

                // Update the UI
                document.getElementById('display-key').innerText = objectKey;
                document.getElementById('display-meta').innerText = JSON.stringify(metaData.metadata, null, 2);
                document.getElementById('downloadLink').href = linkData.download_url;
                
                document.getElementById('result-section').style.display = "block";
                
            } catch (error) {
                alert("Error communicating with API. Is Docker running?");
                console.error(error);
            } finally {
                uploadBtn.innerText = "Upload to S3 / MinIO";
                uploadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
